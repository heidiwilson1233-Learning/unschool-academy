  no AI-generated imagery).
  Character identity: Tara orange squirrel (#f0a04b / #d9822b / #7a4a2b),
  Momo lavender elephant (#c9b8e8 / #8e76c4 / #6b5a8a),
  Bobo mint-green tortoise (#7fc79a / #9fd8b4 / #4d7a63). Light surfaces only.
  Companions: studio-0340/village-scene-divider.svg (same scene-divider language),
  studio-1140/exam-catalogue-band-bunting.svg and -four-gates.svg.
  Usage: /exams catalogue craft band scene divider, full-width, ~260-300px tall.
  License note: original work created for Unschool Academy; do not reuse raw SVG
  elsewhere without A17 editorial sign-off.
-->
