<!--
  Unschool Academy — hand-crafted studio asset (A09, cycle 2026-10-12 11:40 IST)
  "exam-catalogue-band-study-nook.svg" — study-nook scene divider for the /exams
  catalogue craft band: a hand-drawn desk with book stacks, an open book, a
  pencil cup and a lamp; Tara reads on the open book while Bobo and Momo peek
  from behind the desk clutter.
