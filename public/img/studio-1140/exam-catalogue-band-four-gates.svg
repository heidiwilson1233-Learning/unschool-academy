  <text x="600" y="90" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="17" fill="#7a5a3a" font-style="italic">every listed exam passes all four — the rest stay research</text>
  <path d="M440 102 C 540 110, 660 96, 760 104" fill="none" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/>
