<!--
  Unschool Academy — hand-crafted studio asset (A09, cycle 2026-10-12 11:40 IST)
  "exam-catalogue-band-four-gates.svg" — the four-gates trail band for the /exams
  catalogue craft band: a hand-drawn winding path with four wooden signposts,
  one per publishing gate from app/exams/page.tsx (GATES const):
  01 facts checked, 02 syllabus map, 03 honest practice, 04 free sample.
  Tara's paw-print trail winds between the posts toward a pennant flag.
  100% original, authored by hand (no templates, no stock, no AI-generated imagery).
  Light surfaces only; hand-lettered title in the studio cursive stack.
  Companions: studio-0940/levels-ladder.svg (same signpost/diagram language),
  studio-1140/exam-catalogue-band-bunting.svg and -study-nook.svg.
  Usage: /exams "Our publishing promise" section band, full-width, ~300px tall.
  License note: original work created for Unschool Academy; do not reuse raw SVG
  elsewhere without A17 editorial sign-off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Hand-drawn trail with four wooden signposts for the four publishing gates">
  <rect x="0" y="0" width="1200" height="300" fill="#fdf6e9"/>

