<?xml version="1.0" encoding="UTF-8"?>
<!--
  Unschool Academy — hand-crafted studio asset (A09, cycle 2026-10-12 03:40 IST)
  "paper-texture-band.svg" — kraft paper texture band for the homepage kids section.
  100% original, authored by hand (no stock grain overlays, no filters screenshots).
  Grain is drawn speckle-by-speckle; deckled edges are hand-wobbled; doodles are
  original pencil-line marks in the warm-studio palette.
  Usage: kids section background band (stretched full-width, height ~120-160px),
  sits behind section headings. Light surfaces only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-label="Hand-drawn kraft paper texture band with pencil doodles">
  <!-- base kraft sheet with deckled (torn) top and bottom edges -->
  <path d="M0 6
           C 60 2, 110 10, 170 7 S 300 4, 360 8 S 480 5, 540 9 S 660 4, 720 8 S 840 5, 900 9 S 1020 4, 1080 8 S 1140 6, 1200 8
           L 1200 154
           C 1140 157, 1090 151, 1030 154 S 910 157, 850 153 S 730 156, 670 152 S 550 156, 490 153 S 370 156, 310 152 S 190 156, 130 153 S 60 156, 0 152
           Z"
        fill="#f3e3c3"/>
  <!-- second torn layer offset (collage feel) -->
  <path d="M0 18
           C 80 14, 150 20, 230 16 S 380 14, 460 18 S 610 14, 690 18 S 840 14, 920 18 S 1050 14, 1130 18 L 1200 17
           L 1200 144 C 1120 147, 1050 141, 970 145 S 830 148, 750 143 S 610 147, 530 144 S 390 148, 310 144 S 170 148, 90 144 S 40 146, 0 143
           Z"
        fill="#efdcbb" opacity="0.85"/>
  <!-- grain speckle, hand-placed in uneven clusters -->
  <g fill="#d9b981" opacity="0.5">
    <circle cx="52" cy="44" r="1.4"/><circle cx="88" cy="70" r="1.1"/><circle cx="140" cy="38" r="1.3"/>
    <circle cx="205" cy="96" r="1.5"/><circle cx="262" cy="52" r="1.1"/><circle cx="318" cy="80" r="1.4"/>
    <circle cx="390" cy="42" r="1.2"/><circle cx="442" cy="112" r="1.5"/><circle cx="520" cy="60" r="1.1"/>
    <circle cx="588" cy="96" r="1.4"/><circle cx="640" cy="40" r="1.2"/><circle cx="712" cy="76" r="1.5"/>
    <circle cx="782" cy="118" r="1.1"/><circle cx="846" cy="52" r="1.4"/><circle cx="912" cy="88" r="1.2"/>
    <circle cx="986" cy="42" r="1.5"/><circle cx="1048" cy="104" r="1.1"/><circle cx="1114" cy="60" r="1.4"/>
    <circle cx="1168" cy="110" r="1.2"/>
  </g>
  <g fill="#c49a5f" opacity="0.35">
    <circle cx="120" cy="120" r="1.6"/><circle cx="350" cy="124" r="1.3"/><circle cx="610" cy="128" r="1.6"/>
    <circle cx="880" cy="126" r="1.3"/><circle cx="1090" cy="122" r="1.6"/><circle cx="20" cy="100" r="1.3"/>
  </g>
  <!-- long hand-rubbed fibers -->
  <g stroke="#dcbf8d" stroke-width="1.2" opacity="0.6" fill="none" stroke-linecap="round">
    <path d="M170 60 c 22 -3, 40 4, 62 2"/>
    <path d="M470 40 c 20 4, 42 -2, 60 3"/>
    <path d="M760 110 c 24 -4, 44 3, 66 0"/>
    <path d="M990 46 c 20 3, 38 -3, 58 2"/>
  </g>
  <!-- ===== pencil doodles, all original marks ===== -->
  <g stroke="#8a5a3b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75">
    <!-- small star -->
    <path d="M232 116 l 3 7 l 7 1 l -5 5 l 1 7 l -6 -3.5 l -6 3.5 l 1 -7 l -5 -5 l 7 -1 z"/>
    <!-- squiggle -->
    <path d="M560 118 c 6 -6, 4 -12, 10 -14 c 6 -2, 8 4, 14 2 c 6 -2, 6 -8, 12 -8"/>
    <!-- heart -->
    <path d="M1020 112 c -3 -5, -1 -9, 3 -9 c 2 0, 3 1.5, 3.5 3 c 0.5 -1.5, 1.5 -3, 3.5 -3 c 4 0, 6 4, 3 9 c -2 3.5, -6.5 6, -6.5 6 c 0 0, -4.5 -2.5, -6.5 -6 z"/>
    <!-- tiny book -->
    <path d="M330 108 l 14 -3 l 0 16 l -14 3 z M330 108 l 5 -6 l 14 -3 l -5 6"/>
    <!-- magnifier -->
    <circle cx="820" cy="112" r="7"/><line x1="825" y1="117" x2="832" y2="124"/>
  </g>
  <!-- dashed stitch borders, top and bottom (hand-sewn) -->
  <path d="M0 26 C 120 22, 260 28, 400 24 S 680 22, 820 26 S 1040 22, 1200 26"
        fill="none" stroke="#a67c4f" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.8"/>
  <path d="M0 134 C 140 138, 280 132, 420 136 S 700 138, 840 134 S 1060 138, 1200 134"
        fill="none" stroke="#a67c4f" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.8"/>
  <!-- two small kraft tape patches holding the sheet down -->
  <g opacity="0.9">
    <rect x="96" y="2" width="64" height="22" rx="2" transform="rotate(-6 128 13)" fill="#e8c88f" stroke="#b98d55" stroke-width="1.5"/>
    <rect x="1040" y="2" width="64" height="22" rx="2" transform="rotate(5 1072 13)" fill="#e8c88f" stroke="#b98d55" stroke-width="1.5"/>
    <path d="M108 4 l 40 16 M1140 20 l -40 -16" stroke="#b98d55" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
